name: Platform candidate
run-name: platform ${{ inputs.attempt }}
'on':
  workflow_dispatch:
    inputs:
      attempt:
        description: attempt
        required: true
        type: string
      manifest_identity:
        description: manifest identity
        required: true
        type: string
      candidate_sha256:
        description: candidate sha256
        required: true
        type: string
      app:
        description: app
        required: true
        type: string
      candidate_key:
        description: candidate key
        required: true
        type: string
permissions:
  contents: read
env:
  AWS_DEFAULT_REGION: auto
  AWS_PAGER: ''
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  CANDIDATE_KEY: ${{ inputs.candidate_key }}
  CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
  MANIFEST_IDENTITY: ${{ inputs.manifest_identity }}
  ATTEMPT: ${{ inputs.attempt }}
  APP: ${{ inputs.app }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.verify.outputs.version }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      payload_date: ${{ steps.verify.outputs.payload_date }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install private storage CLI
      run: python3 -m pip install awscli
      working-directory: .
    - name: Download and verify private candidate
      run: python3 trusted/scripts/platform_candidate_io.py verify
      id: verify
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
    - uses: actions/upload-artifact@v4
      with:
        name: identity
        path: identity/identity.json
        if-no-files-found: error
    - name: Transfer verified candidate to private storage
      run: python3 trusted/scripts/platform_candidate_io.py transfer candidate.tar.gz candidate.tar.gz
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
  test-macos:
    name: test-macos
    runs-on: macos-latest
    needs:
    - verify
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install private storage CLI
      run: python3 -m pip install awscli
      working-directory: .
    - name: Download private candidate
      run: python3 trusted/scripts/platform_candidate_io.py download transfer "candidate.tar.gz" "candidate-input/candidate.tar.gz"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
    - name: Extract verified candidate
      run: |
        python3 trusted/scripts/platform_candidate_io.py extract candidate-input/candidate.tar.gz candidate
      working-directory: .
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: candidate/go.sum
    - name: Test
      run: go test ./... -count=1
      env:
        CGO_ENABLED: ${{ runner.os == 'macOS' && '1' || '0' }}
  test-linux:
    name: test-linux
    runs-on: ubuntu-latest
    needs:
    - verify
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install private storage CLI
      run: python3 -m pip install awscli
      working-directory: .
    - name: Download private candidate
      run: python3 trusted/scripts/platform_candidate_io.py download transfer "candidate.tar.gz" "candidate-input/candidate.tar.gz"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
    - name: Extract verified candidate
      run: |
        python3 trusted/scripts/platform_candidate_io.py extract candidate-input/candidate.tar.gz candidate
      working-directory: .
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: candidate/go.sum
    - name: Test
      run: go test ./... -count=1
      env:
        CGO_ENABLED: ${{ runner.os == 'macOS' && '1' || '0' }}
  test-windows:
    name: test-windows
    runs-on: windows-latest
    needs:
    - verify
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install private storage CLI
      run: python3 -m pip install awscli
      working-directory: .
    - name: Download private candidate
      run: python3 trusted/scripts/platform_candidate_io.py download transfer "candidate.tar.gz" "candidate-input/candidate.tar.gz"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
    - name: Extract verified candidate
      run: |
        python3 trusted/scripts/platform_candidate_io.py extract candidate-input/candidate.tar.gz candidate
      working-directory: .
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: candidate/go.sum
    - name: Test
      run: go test ./... -count=1
      env:
        CGO_ENABLED: ${{ runner.os == 'macOS' && '1' || '0' }}
  license:
    name: license
    runs-on: ubuntu-latest
    needs:
    - verify
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install private storage CLI
      run: python3 -m pip install awscli
      working-directory: .
    - name: Download private candidate
      run: python3 trusted/scripts/platform_candidate_io.py download transfer "candidate.tar.gz" "candidate-input/candidate.tar.gz"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
    - name: Extract verified candidate
      run: |
        python3 trusted/scripts/platform_candidate_io.py extract candidate-input/candidate.tar.gz candidate
      working-directory: .
    - name: License
      run: python3 scripts/ablation-check.py LICENSE
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    needs:
    - verify
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install private storage CLI
      run: python3 -m pip install awscli
      working-directory: .
    - name: Download private candidate
      run: python3 trusted/scripts/platform_candidate_io.py download transfer "candidate.tar.gz" "candidate-input/candidate.tar.gz"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
    - name: Extract verified candidate
      run: |
        python3 trusted/scripts/platform_candidate_io.py extract candidate-input/candidate.tar.gz candidate
      working-directory: .
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: candidate/go.sum
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install the browser driver
      run: |
        npm install --no-save playwright
        npx playwright install --with-deps chromium
    - name: Conformance gate
      run: go test ./internal/server -run TestMalleableHTMLFileHostGate -count=1 -v
      env:
        HTMLCLAY_HOST_GATE: '1'
        HTMLCLAY_HOST_GATE_RUNNER: ${{ github.workspace }}/candidate/testdata/conformance/host-test.mjs
        HTMLCLAY_HOST_GATE_CWD: ${{ github.workspace }}/candidate
  build-linux-amd64:
    name: build-linux-amd64
    runs-on: ubuntu-24.04
    needs:
    - verify
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install private storage CLI
      run: python3 -m pip install awscli
      working-directory: .
    - name: Download private candidate
      run: python3 trusted/scripts/platform_candidate_io.py download transfer "candidate.tar.gz" "candidate-input/candidate.tar.gz"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
    - name: Extract verified candidate
      run: |
        python3 trusted/scripts/platform_candidate_io.py extract candidate-input/candidate.tar.gz candidate
      working-directory: .
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: candidate/go.sum
    - name: Fetch Tailwind
      run: go run ./cmd/fetchtailwind -goos linux -goarch amd64
    - name: Test the Tailwind bundle
      run: go test -tags tailwind_bundle ./internal/tailwind/ -count=1
    - name: Build
      run: |
        GOOS=linux GOARCH=amd64 \
          go build -tags tailwind_bundle -trimpath -ldflags="-s -w -X main.version=${{ needs.verify.outputs.version }} -X main.updateChannel=stable" -o htmlclay ./cmd/htmlclay
        go version -m htmlclay | grep -q -- '-tags=tailwind_bundle'
      env:
        CGO_ENABLED: '0'
    - name: Package
      run: |
        stage=htmlclay-linux-amd64
        mkdir -p "$stage"
        cp htmlclay "$stage/"
        cp packaging/linux/htmlclay.desktop \
           packaging/linux/htmlclay-mime.xml \
           packaging/linux/htmlclay.png \
           packaging/linux/htmlclay.svg \
           packaging/linux/application-x-htmlclay.png \
           packaging/linux/application-x-htmlclay.svg \
           packaging/linux/install-icon.sh \
           packaging/linux/install.sh \
           packaging/linux/uninstall.sh \
           "$stage/"
        chmod +x "$stage/install.sh" "$stage/install-icon.sh" "$stage/uninstall.sh"
        tar czf "$stage.tar.gz" -C "$stage" .
    - name: Update artifact
      env:
        VERSION: ${{ needs.verify.outputs.version }}
        GOARCH: amd64
      run: gzip -9 -n -c htmlclay > "htmlclay-${VERSION}-linux-${GOARCH}.gz"
    - name: Retain htmlclay-linux-amd64.tar.gz
      run: python3 "$GITHUB_WORKSPACE/trusted/scripts/platform_candidate_io.py" retain "candidate/htmlclay-linux-amd64.tar.gz"
        "htmlclay-linux-amd64.tar.gz"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
    - name: Retain htmlclay-${{ needs.verify.outputs.version }}-linux-amd64.gz
      run: python3 "$GITHUB_WORKSPACE/trusted/scripts/platform_candidate_io.py" retain "candidate/htmlclay-${{ needs.verify.outputs.version
        }}-linux-amd64.gz" "htmlclay-${{ needs.verify.outputs.version }}-linux-amd64.gz"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
  build-linux-arm64:
    name: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    needs:
    - verify
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install private storage CLI
      run: python3 -m pip install awscli
      working-directory: .
    - name: Download private candidate
      run: python3 trusted/scripts/platform_candidate_io.py download transfer "candidate.tar.gz" "candidate-input/candidate.tar.gz"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
    - name: Extract verified candidate
      run: |
        python3 trusted/scripts/platform_candidate_io.py extract candidate-input/candidate.tar.gz candidate
      working-directory: .
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: candidate/go.sum
    - name: Fetch Tailwind
      run: go run ./cmd/fetchtailwind -goos linux -goarch arm64
    - name: Build
      run: |
        GOOS=linux GOARCH=arm64 \
          go build -tags tailwind_bundle -trimpath -ldflags="-s -w -X main.version=${{ needs.verify.outputs.version }} -X main.updateChannel=stable" -o htmlclay ./cmd/htmlclay
        go version -m htmlclay | grep -q -- '-tags=tailwind_bundle'
      env:
        CGO_ENABLED: '0'
    - name: Package
      run: |
        stage=htmlclay-linux-arm64
        mkdir -p "$stage"
        cp htmlclay "$stage/"
        cp packaging/linux/htmlclay.desktop \
           packaging/linux/htmlclay-mime.xml \
           packaging/linux/htmlclay.png \
           packaging/linux/htmlclay.svg \
           packaging/linux/application-x-htmlclay.png \
           packaging/linux/application-x-htmlclay.svg \
           packaging/linux/install-icon.sh \
           packaging/linux/install.sh \
           packaging/linux/uninstall.sh \
           "$stage/"
        chmod +x "$stage/install.sh" "$stage/install-icon.sh" "$stage/uninstall.sh"
        tar czf "$stage.tar.gz" -C "$stage" .
    - name: Update artifact
      env:
        VERSION: ${{ needs.verify.outputs.version }}
        GOARCH: arm64
      run: gzip -9 -n -c htmlclay > "htmlclay-${VERSION}-linux-${GOARCH}.gz"
    - name: Retain htmlclay-linux-arm64.tar.gz
      run: python3 "$GITHUB_WORKSPACE/trusted/scripts/platform_candidate_io.py" retain "candidate/htmlclay-linux-arm64.tar.gz"
        "htmlclay-linux-arm64.tar.gz"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
    - name: Retain htmlclay-${{ needs.verify.outputs.version }}-linux-arm64.gz
      run: python3 "$GITHUB_WORKSPACE/trusted/scripts/platform_candidate_io.py" retain "candidate/htmlclay-${{ needs.verify.outputs.version
        }}-linux-arm64.gz" "htmlclay-${{ needs.verify.outputs.version }}-linux-arm64.gz"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
  build-windows-amd64:
    name: build-windows-amd64
    runs-on: windows-latest
    needs:
    - verify
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install private storage CLI
      run: python3 -m pip install awscli
      working-directory: .
    - name: Download private candidate
      run: python3 trusted/scripts/platform_candidate_io.py download transfer "candidate.tar.gz" "candidate-input/candidate.tar.gz"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
    - name: Extract verified candidate
      run: |
        python3 trusted/scripts/platform_candidate_io.py extract candidate-input/candidate.tar.gz candidate
      working-directory: .
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: candidate/go.sum
    - name: Embed icon and version resources
      run: |
        go run github.com/tc-hib/go-winres@v0.3.1 make `
          --in packaging/windows/winres.json `
          --out cmd/htmlclay/resource `
          --arch amd64 `
          --file-version "${{ needs.verify.outputs.version }}" --product-version "${{ needs.verify.outputs.version }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      shell: pwsh
    - name: Fetch Tailwind
      run: |
        go run ./cmd/fetchtailwind -goos windows -goarch amd64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      shell: pwsh
    - name: Test the Tailwind bundle
      run: go test -tags tailwind_bundle ./internal/tailwind/ -count=1
      shell: pwsh
    - name: Build
      run: |
        $env:CGO_ENABLED = "0"
        $env:GOARCH = "amd64"
        go build -tags tailwind_bundle -trimpath -ldflags="-s -w -X main.version=${{ needs.verify.outputs.version }} -X main.updateChannel=stable" -o htmlclay.exe ./cmd/htmlclay
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (-not (go version -m htmlclay.exe | Select-String -SimpleMatch -- '-tags=tailwind_bundle')) { Write-Error "built without the Tailwind bundle"; exit 1 }
      shell: pwsh
    - name: Install TrustedSigning module
      run: Install-Module -Name TrustedSigning -Force -Scope CurrentUser -AcceptLicense
      shell: pwsh
    - name: Sign with Azure Trusted Signing
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      run: |
        Invoke-TrustedSigning `
          -Endpoint "https://eus.codesigning.azure.net" `
          -CodeSigningAccountName "Hyperclay" `
          -CertificateProfileName "HyperclayLocalPublicCertProfile" `
          -Files "$PWD\htmlclay.exe" `
          -FileDigest SHA256 `
          -TimestampRfc3161 "http://timestamp.acs.microsoft.com" `
          -TimestampDigest SHA256 `
          -Verbose
      shell: pwsh
    - name: Verify signature
      run: |
        $sig = Get-AuthenticodeSignature "htmlclay.exe"
        Write-Host "Status: $($sig.Status)"
        Write-Host "Signer: $($sig.SignerCertificate.Subject)"
        if ($sig.Status -ne "Valid") {
          Write-Error "Signature verification failed!"
          exit 1
        }
        # Azure Trusted Signing issues three-day certificates, so an untimestamped
        # signature stops validating three days after the release and Windows then
        # treats the binary as unsigned. Status is "Valid" here either way, because
        # the certificate has not expired yet on the runner, so the timestamp is the
        # only thing that proves the signature will still verify for a downloader.
        if (-not $sig.TimeStamperCertificate) {
          Write-Error "Signature has no RFC3161 timestamp; it would expire with the certificate."
          exit 1
        }
        Write-Host "Timestamped by: $($sig.TimeStamperCertificate.Subject)"
      shell: pwsh
    - name: Package
      run: |
        Compress-Archive `
          -Path htmlclay.exe,packaging\windows\README.txt,packaging\windows\register.bat `
          -DestinationPath htmlclay-windows-amd64.zip
      shell: pwsh
    - name: Update artifact
      run: Copy-Item htmlclay.exe "htmlclay-${{ needs.verify.outputs.version }}-windows-amd64.exe"
      shell: pwsh
    - name: Retain htmlclay-windows-amd64.zip
      run: python3 "$GITHUB_WORKSPACE/trusted/scripts/platform_candidate_io.py" retain "candidate/htmlclay-windows-amd64.zip"
        "htmlclay-windows-amd64.zip"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
    - name: Retain htmlclay-${{ needs.verify.outputs.version }}-windows-amd64.exe
      run: python3 "$GITHUB_WORKSPACE/trusted/scripts/platform_candidate_io.py" retain "candidate/htmlclay-${{ needs.verify.outputs.version
        }}-windows-amd64.exe" "htmlclay-${{ needs.verify.outputs.version }}-windows-amd64.exe"
      working-directory: .
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
  build-windows-arm64:
