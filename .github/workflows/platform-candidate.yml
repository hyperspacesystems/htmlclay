      run: |
        Compress-Archive `
          -Path htmlclay.exe,packaging\windows\README.txt,packaging\windows\register.bat `
          -DestinationPath htmlclay-windows-arm64.zip
      shell: pwsh
    - name: Update artifact
      run: Copy-Item htmlclay.exe "htmlclay-${{ needs.verify.outputs.version }}-windows-arm64.exe"
      shell: pwsh
    - name: Retain htmlclay-windows-arm64.zip
      run: python3 "$GITHUB_WORKSPACE/trusted/scripts/platform_candidate_io.py" retain "candidate/htmlclay-windows-arm64.zip"
        "htmlclay-windows-arm64.zip"
