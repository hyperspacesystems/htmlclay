        $env:GOARCH = "arm64"
        go build -tags tailwind_bundle -trimpath -ldflags="-s -w -X main.version=${{ needs.verify.outputs.version }} -X main.updateChannel=stable" -o htmlclay.exe ./cmd/htmlclay
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (-not (go version -m htmlclay.exe | Select-String -SimpleMatch -- '-tags=tailwind_bundle')) { Write-Error "built without the Tailwind bundle"; exit 1 }
      shell: pwsh
    - name: Install TrustedSigning module
      run: Install-Module -Name TrustedSigning -Force -Scope CurrentUser -AcceptLicense
      shell: pwsh
    - name: Sign with Azure Trusted Signing
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      run: |
        Invoke-TrustedSigning `
          -Endpoint "https://eus.codesigning.azure.net" `
          -CodeSigningAccountName "Hyperclay" `
          -CertificateProfileName "HyperclayLocalPublicCertProfile" `
          -Files "$PWD\htmlclay.exe" `
          -FileDigest SHA256 `
          -TimestampRfc3161 "http://timestamp.acs.microsoft.com" `
          -TimestampDigest SHA256 `
          -Verbose
      shell: pwsh
    - name: Verify signature
      run: |
        $sig = Get-AuthenticodeSignature "htmlclay.exe"
        Write-Host "Status: $($sig.Status)"
        Write-Host "Signer: $($sig.SignerCertificate.Subject)"
        if ($sig.Status -ne "Valid") {
          Write-Error "Signature verification failed!"
          exit 1
        }
        # Azure Trusted Signing issues three-day certificates, so an untimestamped
        # signature stops validating three days after the release and Windows then
        # treats the binary as unsigned. Status is "Valid" here either way, because
        # the certificate has not expired yet on the runner, so the timestamp is the
        # only thing that proves the signature will still verify for a downloader.
        if (-not $sig.TimeStamperCertificate) {
          Write-Error "Signature has no RFC3161 timestamp; it would expire with the certificate."
          exit 1
        }
        Write-Host "Timestamped by: $($sig.TimeStamperCertificate.Subject)"
      shell: pwsh
