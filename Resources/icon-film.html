  const mixLoop = (a, b, t) => a.map(([x, y], i) => [lerp(x, b[i][0], t), lerp(y, b[i][1], t)]);

  // the mouth outline for face clock t and pant amount, the same arithmetic as drawFace
  function mouthPoints(t, pant) {
    const pw = clamp01(pant * 1.4 - 0.15);
    let loop = null;
    if (pw < 0.999) {
      const pp = (t / 0.55) % 6;
      const leg = pp < 3 ? pp : 6 - pp;
      const i = Math.min(2, Math.floor(leg));
      const k = FACE_R * 1.15;
      loop = mixLoop(WOB[i], WOB[i + 1], smooth(0, 1, leg - i)).map(([x, y]) => [x * k, 5 + y * k]);
    }
    if (pw > 0.001) {
      const o = clamp01(pant);
      const pl = o < 0.5 ? mixLoop(PANT[0], PANT[1], o * 2) : mixLoop(PANT[1], PANT[2], o * 2 - 1);
      const k = FACE_R * 0.75;
      const world = pl.map(([x, y]) => [FACE_R * 0.85 + x * k, 2 + y * k]);
      loop = loop ? mixLoop(loop, world, pw) : world;
    }
    let mx = 0, my = 0;
    for (const [x, y] of loop) { mx += x; my += y; }
    mx /= MN; my /= MN;
    return loop.map(([x, y]) => {
      const a = Math.atan2(y - my, x - mx);
      const w = 1 + 0.07 * Math.sin(1.1 * t + a * 2) + 0.045 * Math.sin(1.9 * t + a * 3 + 1.3);

    const blink = (t % 3.7) < 0.12 ? Math.sin(Math.PI * (t % 3.7) / 0.12) : 0;

  function decodeTake(take) {

  // one frame as numbers: the engine's frame, or the relax blend once the engine's frames end

    let mouth = mouthPoints(clock, s.pant), ring = null, ink = data.ink, eye = EYE, fx = s.fx, fy = s.fy, ang = s.ang, u = 0;
    if (R && T > R.at) {

      const F = R.face;

      mouth = mouth.map(([x, y], i) => [lerp(x, F.smile[i * 2], m), lerp(y, F.smile[i * 2 + 1], m)]);

    return { state: s, ring, u, ink, fx, fy, ang, dir: s.dir, k: data.S * s.scale, eye: { dx: eye.dx, rx: eye.rx, ry: eye.ry * open, rot: eye.rot }, mouth };

  function beatAt(data, T) {
    let b = 0;
    for (let i = 0; i < data.beats.length; i++) if (T >= data.beats[i][0]) b = i;
    return b;
  }

  return { decodeTake, numbers, beatAt };
})();

// The capture's frames drawn in the finished style of the HTML Clay icon, in the icon's own units.
const IconDraw = (() => {
  'use strict';
  const G = GooDraw;
  const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
  const smooth = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const f2 = v => (Math.round(v * 100) / 100).toString();
  const xy = (x, y) => f2(x) + ' ' + f2(y);
  const ARC = 0.5522847498;
  const RIM = [[1, 0], [1, ARC], [ARC, 1], [0, 1], [-ARC, 1], [-1, ARC], [-1, 0], [-1, -ARC], [-ARC, -1], [0, -1], [ARC, -1], [1, -ARC], [1, 0]];
  // how far the box stops covering him by the end of the relax, when in the relax that happens, and
  // how far the box drawn under him reaches past that line, so the two drawings of the box overlap
  const UNCOVER = { by: 48, from: 0.24, to: 0.5, lap: 12 };
  // how sharply a highlight end picks its place on the outline, in icon units of reach
  const SOFT = 6;

  // the outline curve as quadratic pieces: start, control, end
  function pieces(P, N) {
    const S = new Float64Array(N * 6);
    for (let i = 0; i < N; i++) {
      const a = ((i + N - 1) % N) * 2, b = i * 2, c = ((i + 1) % N) * 2, o = i * 6;
      S[o] = (P[a] + P[b]) / 2; S[o + 1] = (P[a + 1] + P[b + 1]) / 2;
      S[o + 2] = P[b]; S[o + 3] = P[b + 1];
      S[o + 4] = (P[b] + P[c]) / 2; S[o + 5] = (P[b + 1] + P[c + 1]) / 2;
    }
    return S;
  }
  // the point of the outline that reaches farthest in direction (nx, ny)
  function reach(S, nx, ny) {
    let best = -Infinity, bx = 0, by = 0;
    for (let o = 0; o < S.length; o += 6) {
      const a = (S[o + 2] - S[o]) * nx + (S[o + 3] - S[o + 1]) * ny, b = (S[o + 4] - S[o + 2]) * nx + (S[o + 5] - S[o + 3]) * ny;
      const t = a > 0 && b < 0 ? a / (a - b) : 0, u = 1 - t;
      const x = u * u * S[o] + 2 * u * t * S[o + 2] + t * t * S[o + 4], y = u * u * S[o + 1] + 2 * u * t * S[o + 3] + t * t * S[o + 5];
      const h = x * nx + y * ny;
      if (h > best) { best = h; bx = x; by = y; }
    }
    return [bx, by];
  }
  function loop(P, N) {
    const mx = i => (P[(i % N) * 2] + P[((i + 1) % N) * 2]) / 2, my = i => (P[(i % N) * 2 + 1] + P[((i + 1) % N) * 2 + 1]) / 2;
    let d = 'M' + xy(mx(0), my(0));
    for (let i = 1; i <= N; i++) d += 'Q' + xy(P[(i % N) * 2], P[(i % N) * 2 + 1]) + ' ' + xy(mx(i), my(i));
    return d + 'Z';
  }

  // the outline as a dense loop of points with the distance travelled to each
  function walk(S) {
    const per = S.length > 360 ? 2 : 6, M = S.length / 6 * per, X = new Float64Array(M), Y = new Float64Array(M), D = new Float64Array(M + 1);
    for (let o = 0, k = 0; o < S.length; o += 6) {

        const t = j / per, u = 1 - t;
        X[k] = u * u * S[o] + 2 * u * t * S[o + 2] + t * t * S[o + 4]; Y[k] = u * u * S[o + 1] + 2 * u * t * S[o + 3] + t * t * S[o + 5];

    let area = 0;
    for (let i = 0; i < M; i++) {
      const j = (i + 1) % M;
      D[i + 1] = D[i] + Math.hypot(X[j] - X[i], Y[j] - Y[i]);
      area += X[i] * Y[j] - X[j] * Y[i];

    return { X, Y, D, M, L: D[M], turn: area > 0 ? 1 : -1 };

  // pick, so the place slides along a flat side as it tilts instead of jumping from end to end
  function facing(W, deg) {

    for (let i = 0; i < W.M; i++) top = Math.max(top, W.X[i] * nx + W.Y[i] * ny);

      c += w * Math.cos(at); s += w * Math.sin(at);

  function place(W, s) {

    let lo = 0, hi = W.M - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (W.D[m] <= s) lo = m; else hi = m - 1; }
    const i = lo, j = (i + 1) % W.M, h = (i + W.M - 1) % W.M, k = (j + 1) % W.M, f = (s - W.D[i]) / (W.D[i + 1] - W.D[i] || 1);
    const tx = lerp(W.X[j] - W.X[h], W.X[k] - W.X[i], f), ty = lerp(W.Y[j] - W.Y[h], W.Y[k] - W.Y[i], f), len = Math.hypot(tx, ty) || 1;
    return [lerp(W.X[i], W.X[j], f), lerp(W.Y[i], W.Y[j], f), W.turn * ty / len, -W.turn * tx / len];
  }

  // the edge of his silhouette: the outline pushed out by half the ink width, as a many-sided shape
  function skin(W, half) {
    let d = '';
    for (let i = 0; i < W.M; i++) {
      const j = (i + 1) % W.M, h = (i + W.M - 1) % W.M, tx = W.X[j] - W.X[h], ty = W.Y[j] - W.Y[h], len = Math.hypot(tx, ty) || 1;
      d += (i ? 'L' : 'M') + xy(W.X[i] + W.turn * ty / len * half, W.Y[i] - W.turn * tx / len * half);
    }
    return d + 'Z';
  }

  function create(data, look) {
    const K = 1 / data.world.iconScale, OX = look.anchor[0] - data.world.box[0] * K, OY = look.anchor[1] - data.world.floorY * K;
    const floorY = look.anchor[1], [boxL, , boxR] = look.box;

    // eyes and mouth as one path: the game's ellipses and mouth loop, carried through the face's placement
    function facePath(n) {
      const c = Math.cos(n.ang), s = Math.sin(n.ang), sx = n.dir * n.k * K, sy = n.k * K, fx = OX + n.fx * K, fy = OY + n.fy * K;
      const put = (x, y) => xy(fx + c * sx * x - s * sy * y, fy + s * sx * x + c * sy * y);
      const r = n.eye.rot * Math.PI / 180, cr = Math.cos(r), sr = Math.sin(r);
      let d = '';
      for (const side of [-1, 1]) {
        const at = ([ex, ey]) => put(side * n.eye.dx + cr * ex * n.eye.rx - sr * ey * n.eye.ry, -6 + sr * ex * n.eye.rx + cr * ey * n.eye.ry);
        d += 'M' + at(RIM[0]);
        for (let i = 1; i < 13; i += 3) d += 'C' + at(RIM[i]) + ' ' + at(RIM[i + 1]) + ' ' + at(RIM[i + 2]);
        d += 'Z';
      }
      const M = n.mouth, MN = M.length, mid = i => put((M[i % MN][0] + M[(i + 1) % MN][0]) / 2, (M[i % MN][1] + M[(i + 1) % MN][1]) / 2);
      d += 'M' + mid(0);
      for (let i = 1; i <= MN; i++) d += 'Q' + put(M[i % MN][0], M[i % MN][1]) + ' ' + mid(i);
      return d + 'Z';
    }

    // a highlight: it runs along the same stretch of his outline as on the icon, between the places
    // that face the same two ways, so it stays on the lit side while he rolls and squashes
    function glint(W, half, g, u) {
      const from = facing(W, g.face[0]), to = facing(W, g.face[3]);
      let span = (((to - from) * W.turn) % W.L + W.L) % W.L;
      if (span > W.L / 2) span = 0;
      const H = [];
      for (let j = 0; j < 4; j++) {
        const [x, y, nx, ny] = place(W, from + W.turn * span * g.along[j]), d = half - g.inset[j];
        H.push(x + nx * d, y + ny * d);
      }
      // the cubic curve through the four points
      const c = [H[0], H[1], 0, 0, 0, 0, H[6], H[7]];
      for (let k = 0; k < 2; k++) {
        c[2 + k] = (-5 * H[k] + 18 * H[2 + k] - 9 * H[4 + k] + 2 * H[6 + k]) / 6;
        c[4 + k] = (2 * H[k] - 9 * H[2 + k] + 18 * H[4 + k] - 5 * H[6 + k]) / 6;
      }
      const w = smooth(0.35, 0.95, u);
      for (let k = 0; k < 8; k++) c[k] = lerp(c[k], g.ctl[k], w);
      return 'M' + xy(c[0], c[1]) + 'C' + xy(c[2], c[3]) + ' ' + xy(c[4], c[5]) + ' ' + xy(c[6], c[7]);
    }

    // everything one frame needs, as SVG attribute strings
    function pose(T) {
      const n = G.numbers(data, T), last = n.u >= 1, src = n.ring || n.state.n, N = src.length / 2, half = n.ink * K / 2;
      const P = new Float64Array(N * 2);
      for (let i = 0; i < N * 2; i += 2) { P[i] = OX + src[i] * K; P[i + 1] = OY + src[i + 1] * K; }
      const S = pieces(P, N), W = walk(S);
      const x0 = reach(S, -1, 0)[0] - half, x1 = reach(S, 1, 0)[0] + half, y0 = reach(S, 0, -1)[1] - half, y1 = reach(S, 0, 1)[1] + half;
      const outline = loop(P, N), face = facePath(n);
      // a soft shadow on the floor while he is down beside the box
      const mid = (x0 + x1) / 2, beside = Math.max(smooth(boxR - 64, boxR + 16, mid), 1 - smooth(boxL - 12, boxL + 58, mid));
      const near = 1 - clamp01((floorY - y1) / 380);
      const open = UNCOVER.by * smooth(UNCOVER.from, UNCOVER.to, n.u);
      return {
        // on the last frame the page shows the icon's own shapes instead of these
        last, u: n.u, numbers: n, ring: P, bounds: [x0, y0, x1 - x0, y1 - y0], open,
        outline, ink: f2(half * 2),
        // what the highlights are cut to: all of him, ink included
        skin: half ? skin(W, half) : outline,
        // once the relax starts the body has the icon's make-up: face-shaped holes with the face laid in
        blob: n.u > 0 ? outline + face : outline,
        face,
        glints: look.glints.map(g => glint(W, half, g, n.u)),
        // the icon's gradient is measured in the body's bounds, so the film's is too
        grad: 'matrix(' + f2(x1 - x0) + ' 0 0 ' + f2(y1 - y0) + ' ' + f2(x0) + ' ' + f2(y0) + ')',
        floor: { cx: f2(mid), rx: f2((x1 - x0) * (0.3 + 0.2 * near)), o: f2(0.5 * beside * near * near) },
        // the box is drawn over him, less a band along its top and right edge that opens in the relax;
        // in that band the box is drawn under him instead
        cover: 'translate(' + f2(-open) + ' ' + f2(open) + ')',
        under: 'translate(' + f2(-open - Math.min(UNCOVER.lap, open)) + ' ' + f2(open + Math.min(UNCOVER.lap, open)) + ')',
      };
    }

    return { pose, K, OX, OY };
  }

  return { create };
})();
</script>
<script>
(() => {
  'use strict';
  const G = GooDraw;
  const data = G.decodeTake(JSON.parse(document.getElementById('take').textContent));
  const look = JSON.parse(document.getElementById('look').textContent);
  const film = IconDraw.create(data, look);

  const PARTS = ['film', 'rest', 'grad', 'floor', 'body', 'under', 'underClip', 'shadow', 'blob', 'face', 'glintA', 'glintB', 'coverClip', 'shade'];
  const host = document.querySelector('[data-film]');
  const m = { last: {} };
  for (const k of PARTS) m[k] = host.querySelector('[data-k="' + k + '"]');
  const set = (key, attr, value) => {
    if (m.last[key + attr] === value) return;
    m.last[key + attr] = value;
    m[key].setAttribute(attr, value);
  };
  function paint(T) {
    const p = film.pose(T);
    set('film', 'display', p.last ? 'none' : 'inline');
    set('rest', 'display', p.last ? 'inline' : 'none');
    if (p.last) return;
    set('grad', 'gradientTransform', p.grad);
    set('body', 'd', p.skin);
    set('blob', 'd', p.blob);
    set('blob', 'stroke-width', p.ink);
    for (const k of ['shadow', 'shade']) {
      set(k, 'd', p.outline);
      set(k, 'stroke-width', p.ink);
    }
    set('face', 'd', p.face);
    set('glintA', 'd', p.glints[0]);
    set('glintB', 'd', p.glints[1]);
    set('floor', 'opacity', p.floor.o);
    if (p.floor.o !== '0') {
      set('floor', 'cx', p.floor.cx);
      set('floor', 'rx', p.floor.rx);
    }
    set('coverClip', 'transform', p.cover);
    set('under', 'display', p.open > 0 ? 'inline' : 'none');
    set('underClip', 'transform', p.under);
  }

  const LAST = data.end - 1 / data.fps;
  const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let time = 0, playing = false, last = null, frames = 0;

  function tick(now) {
    const dt = last === null ? 0 : Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    time = Math.min(LAST, time + dt);
    paint(time);
    if (time >= LAST) { playing = false; host.dataset.state = 'settled'; return; }
    frames++;
    requestAnimationFrame(tick);
  }
  function play() {
    if (playing) return false;
    time = 0; last = null; playing = true; host.dataset.state = 'playing';
    paint(0);
    requestAnimationFrame(tick);
    return true;
  }
  function settle() { time = LAST; playing = false; paint(LAST); host.dataset.state = 'settled'; }

  host.addEventListener('click', () => { if (!playing) play(); });
  window.iconAnim = { play, settle, get time() { return time; }, get playing() { return playing; }, get frames() { return frames; }, LAST };

  if (calm) settle(); else play();
})();
</script>
